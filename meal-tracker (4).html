const { useState, useEffect } = React;

const DATA = {"RECIPES": {"Scrambled Eggs on Toast": {"cal": 280, "serves": "1 adult + toddler", "ingredients": ["2 large eggs", "1 tsp butter or olive oil", "1 slice sourdough bread", "1/4 cucumber, sliced", "Salt & pepper to taste"], "method": ["Crack eggs into a bowl, whisk with a pinch of salt and pepper.", "Heat butter or oil in a small non-stick pan over low-medium heat.", "Pour in eggs and stir gently until just set — remove slightly early as they keep cooking.", "Toast the sourdough. Serve eggs on toast with cucumber on the side."]}, "Banana Oat Pancakes": {"cal": 320, "serves": "1 adult + toddler (6 small pancakes)", "ingredients": ["1 ripe banana, mashed", "2 large eggs", "1/4 cup (25g) rolled oats", "1/2 tsp vanilla essence (optional)", "Cooking spray or small amount of butter"], "method": ["Mash banana well in a bowl. Beat in eggs until combined.", "Stir in oats and vanilla. Rest 2 min.", "Heat a non-stick pan over medium heat, spray lightly.", "Pour small spoonfuls of batter, cook 2-3 min per side until golden. Serve with a small drizzle of honey if you like."]}, "Overnight Oats with Banana": {"cal": 310, "serves": "1 adult", "ingredients": ["1/2 cup (45g) rolled oats", "1/2 cup (125ml) oat milk", "1 small banana, sliced", "1 tsp honey", "Pinch of cinnamon (optional)"], "method": ["The night before: combine oats and oat milk in a jar. Stir, cover and refrigerate overnight.", "In the morning, top with sliced banana and drizzle with honey.", "Add cinnamon if using. Eat cold straight from the fridge."]}, "Poached Eggs & Avocado on Toast": {"cal": 300, "serves": "1 adult", "ingredients": ["2 large eggs", "1 slice sourdough or wholegrain bread", "1/4 ripe avocado", "1 tsp white vinegar (for poaching)", "Salt & pepper"], "method": ["Bring a small saucepan of water to a gentle simmer. Add vinegar.", "Create a gentle swirl, crack egg into a cup and slide in. Cook 3 min for a runny yolk. Repeat.", "Toast bread while eggs poach.", "Mash avocado on toast, top with poached eggs, season."]}, "Scrambled Eggs & Baked Beans on Toast": {"cal": 330, "serves": "1 adult + toddler", "ingredients": ["2 large eggs", "1 tsp butter or olive oil", "1/2 can (210g) baked beans, low-salt", "1 slice sourdough or wholegrain toast", "Salt & pepper"], "method": ["Warm baked beans in a small saucepan over low heat.", "Whisk eggs with salt and pepper. Heat butter in a pan, scramble gently over low heat.", "Toast bread.", "Serve eggs and beans together on toast."]}, "French Toast with Banana": {"cal": 370, "serves": "1 adult + toddler (2 slices)", "ingredients": ["2 thick slices bread", "2 large eggs", "1/4 cup (60ml) oat milk", "1/2 tsp vanilla essence", "1/2 tsp cinnamon", "1 tsp butter", "1 banana, sliced"], "method": ["Whisk eggs, oat milk, vanilla and cinnamon in a shallow bowl.", "Dip each bread slice and soak 30 seconds each side.", "Heat butter in a pan over medium heat. Cook bread 2-3 min each side until golden.", "Serve topped with banana slices."]}, "Veggie Omelette": {"cal": 280, "serves": "1 adult + toddler", "ingredients": ["2 large eggs", "2 tbsp oat milk or water", "1/2 cup baby spinach", "1/4 capsicum, diced", "1 tbsp grated tasty cheese", "1 tsp olive oil", "Salt & pepper"], "method": ["Whisk eggs with oat milk, salt and pepper.", "Heat oil in a non-stick pan over medium heat. Add capsicum, cook 2 min.", "Pour in egg mixture. Cook until edges set, about 2 min.", "Add spinach and cheese to one half. Fold over, cook 1 more min. Cut into pieces for toddler."]}, "Berry Breakfast Smoothie": {"cal": 250, "serves": "1 adult (toddler can share a small cup)", "ingredients": ["1 scoop vanilla protein powder (lactose-free)", "1 cup (250ml) oat milk", "1/2 frozen banana", "1/2 cup frozen mixed berries", "1 tsp chia seeds (optional)"], "method": ["Add oat milk and protein powder to a blender first.", "Add banana, berries and chia.", "Blend 30-40 seconds until smooth.", "Pour and drink straight away. Pour a small cup for your toddler to share."]}, "Berry Breakfast Bowl": {"cal": 300, "serves": "1 adult + toddler", "ingredients": ["1/2 cup (45g) rolled oats", "3/4 cup (185ml) oat milk", "1/2 cup mixed berries", "1 tbsp peanut or almond butter", "1 tsp honey", "1 tsp chia seeds"], "method": ["Warm oats and oat milk in a small pot or microwave 2-3 min until creamy.", "Spoon into a bowl.", "Top with berries, a swirl of nut butter, honey and chia seeds.", "Serve warm. Mash a little for your toddler."]}, "Tuna & Rice Salad": {"cal": 340, "serves": "1 adult + toddler", "ingredients": ["95g can tuna in springwater, drained", "1/2 cup (90g) steamed white rice, cooled", "1/4 cucumber, diced", "1 tsp olive oil", "Juice of 1/4 lemon", "Salt & pepper to taste"], "method": ["Cook rice if not prepared. Allow to cool slightly.", "Drain tuna and break into chunks.", "Combine rice, tuna and cucumber in a bowl.", "Drizzle with olive oil and lemon juice. Season and toss gently."]}, "Chicken & Corn Soup": {"cal": 300, "serves": "2 serves — save one for later", "ingredients": ["1 chicken breast (approx 200g), diced", "1 can (420g) corn kernels, drained", "4 cups (1 litre) low-salt chicken broth", "1 medium carrot, finely diced", "1 spring onion, sliced", "1 tsp soy sauce (low sodium)", "Salt & pepper"], "method": ["Bring broth to a simmer. Add chicken and carrot, cook 12 min.", "Add corn (blend half the corn first for a creamier soup if you like).", "Stir in soy sauce, simmer 5 min.", "Season, top with spring onion. Cool toddler's portion before serving."]}, "Chicken & Veggie Soup": {"cal": 300, "serves": "2 serves — save one for later", "ingredients": ["1 chicken breast or 2 thighs (approx 250g)", "1 medium carrot, diced", "1 small zucchini, diced", "1 cup dry egg noodles or small pasta", "4 cups (1 litre) low-salt chicken broth", "1/2 tsp garlic powder", "Salt & pepper"], "method": ["Bring broth to a simmer. Add chicken, cook 15 min.", "Remove chicken, shred with two forks, return to pot.", "Add carrot and zucchini, cook 8 min. Add noodles, cook 8-10 min more.", "Season and serve. Refrigerate the second serve for another day."]}, "Tuna Rice Bowl": {"cal": 350, "serves": "1 adult + toddler", "ingredients": ["95g can tuna in springwater, drained", "1/2 cup (90g) steamed white rice", "1/2 cup corn kernels (canned or frozen)", "1 tsp soy sauce (low sodium)", "1/2 tsp sesame oil", "Pinch of sesame seeds (optional)"], "method": ["Cook or reheat rice. Warm corn.", "Drain and flake tuna.", "Arrange rice in a bowl, top with tuna and corn.", "Drizzle with soy sauce and sesame oil. Sprinkle sesame seeds if using."]}, "Beef Patty Wrap with Lettuce": {"cal": 370, "serves": "1 adult + toddler", "ingredients": ["2 leftover beef patties, sliced", "1 large wholegrain wrap", "2 large iceberg or cos lettuce leaves", "1 tbsp tomato sauce (no added sugar, optional)"], "method": ["Warm patties in a pan or microwave until heated through.", "Lay wrap flat, add lettuce leaves, then sliced patties.", "Add sauce if using. Roll up and slice in half."], "note": "Great for using leftover beef patties from another night."}, "Egg & Salad Sandwich": {"cal": 290, "serves": "1 adult + toddler", "ingredients": ["2 hard-boiled eggs, peeled and sliced", "2 slices sourdough bread", "2 large lettuce leaves", "1/4 cucumber, sliced", "1 tsp mayo (optional)", "Salt & pepper"], "method": ["Hard boil eggs: cold water, bring to boil, cook 9 min, cool, peel.", "Spread mayo on bread if using.", "Layer lettuce, cucumber and egg slices. Season.", "Top with second slice. Cut into fingers for toddler."]}, "Leftover Chicken with Rice & Veg": {"cal": 350, "serves": "1 adult + toddler", "ingredients": ["150-200g leftover cooked chicken, sliced", "1/2 cup (90g) steamed white rice", "1 cup mixed steamed veg (carrot, broccoli, peas)", "1 tsp olive oil or soy sauce", "Salt & pepper"], "method": ["Reheat rice and chicken gently in the microwave or a pan.", "Steam the mixed veg 5 min until tender.", "Combine in a bowl, drizzle with olive oil or a little soy sauce.", "Season and serve. Cut chicken small for toddler."], "note": "A quick way to use up roast or baked chicken from the night before."}, "Chicken Wrap with Avocado": {"cal": 390, "serves": "1 adult + toddler", "ingredients": ["150g cooked chicken, sliced", "1 large wholegrain wrap", "1/4 avocado, mashed", "2 lettuce leaves", "1/4 cucumber, sliced", "Squeeze of lemon"], "method": ["Lay the wrap flat and spread with mashed avocado.", "Add lettuce, cucumber and chicken.", "Squeeze over a little lemon, season.", "Roll up tightly and slice in half."]}, "Homemade Baked Chicken Nuggets": {"cal": 360, "serves": "1 adult + toddler (approx 12 nuggets)", "ingredients": ["250g chicken breast, cut into bite-size pieces", "1 egg, beaten", "1/2 cup (60g) breadcrumbs", "1/4 tsp garlic powder", "1/4 tsp paprika", "Salt & pepper", "Cooking spray"], "method": ["Preheat oven to 200C. Line a tray and spray with oil.", "Season breadcrumbs with garlic powder, paprika, salt and pepper.", "Dip chicken in egg, then coat in breadcrumbs.", "Place on tray, spray tops. Bake 18-20 min, turning halfway, until golden and cooked through."]}, "Beef Mince Tacos": {"cal": 410, "serves": "1 adult + toddler", "ingredients": ["200g lean beef mince", "1/2 tsp garlic powder", "1/2 tsp cumin", "1/2 tsp paprika", "2 wholegrain wraps or taco shells", "1 cup shredded lettuce", "1/4 cup corn kernels", "1 tbsp tomato sauce (no added sugar)"], "method": ["Brown mince in a pan over medium heat, breaking up lumps.", "Add garlic powder, cumin, paprika and 2 tbsp water. Simmer 5 min.", "Warm wraps or taco shells.", "Fill with mince, lettuce and corn. Build a mild one for your toddler."]}, "Leftover Protein with Salad": {"cal": 320, "serves": "1 adult + toddler", "ingredients": ["150-200g leftover cooked protein", "2 large lettuce leaves, torn", "1/4 cucumber, sliced", "1/4 avocado, sliced", "1 tsp olive oil", "Squeeze of lemon", "Salt & pepper"], "method": ["Slice or shred leftover protein and warm if preferred.", "Arrange lettuce, cucumber and avocado in a bowl.", "Top with protein, drizzle with olive oil and lemon, season."], "note": "Use any leftover lamb, chicken or beef from the week."}, "Chicken & Salad Bowl": {"cal": 330, "serves": "1 adult + toddler", "ingredients": ["150g cooked chicken breast, sliced", "2 cups mixed salad leaves", "1/4 cucumber, sliced", "1/2 carrot, grated", "1/4 avocado, sliced", "1 tsp olive oil", "Squeeze of lemon", "Salt & pepper"], "method": ["Slice the cooked chicken.", "Arrange salad leaves, cucumber, carrot and avocado in a bowl.", "Top with chicken.", "Drizzle with olive oil and lemon, season. Serve toddler's chicken and veg separately if preferred."]}, "Baked Chicken Thigh with Rice & Veg": {"cal": 420, "serves": "1 adult + toddler", "ingredients": ["2 bone-in chicken thighs (approx 300g)", "1 tsp olive oil", "1/2 tsp garlic powder", "1/2 tsp paprika", "1/2 cup (90g) white rice (dry)", "1 cup broccoli florets", "1 medium carrot, sliced", "Salt & pepper"], "method": ["Preheat oven to 200C. Rub chicken with oil, garlic powder, paprika, salt and pepper.", "Bake on a lined tray 35-40 min until golden and juices run clear.", "Cook rice per packet. Steam broccoli and carrot 5-7 min.", "Serve chicken with rice and vegetables."]}, "Beef Mince Bolognese": {"cal": 440, "serves": "2 serves — save one for later", "ingredients": ["250g lean beef mince", "1 can (400g) crushed tomatoes", "1 medium carrot, finely diced", "1/2 brown onion, diced", "2 cloves garlic, minced", "1 tsp olive oil", "1/2 tsp dried oregano", "150g dry pasta", "Salt & pepper"], "method": ["Heat oil, cook onion 3 min, add garlic 1 min.", "Add mince, brown well, breaking up lumps. Drain excess fat.", "Add carrot, tomatoes and oregano. Simmer 20 min.", "Cook pasta per packet. Serve sauce over pasta."]}, "Chicken Thigh Bake with Roasted Veg": {"cal": 410, "serves": "1 adult + toddler", "ingredients": ["3 bone-in chicken thighs (approx 350g)", "1 tsp olive oil", "1/2 tsp paprika", "1/2 tsp garlic powder", "1 medium sweet potato, cubed", "1 zucchini, chopped", "1 carrot, chopped", "Salt & pepper"], "method": ["Preheat oven to 200C. Toss veg with half the oil and salt on a tray.", "Rub chicken with remaining oil and spices, place on the tray.", "Bake 35-40 min until chicken is cooked and veg is golden.", "Serve together."]}, "Beef Mince Patties with Sweet Potato Mash": {"cal": 450, "serves": "1 adult + toddler (4 small patties)", "ingredients": ["250g lean beef mince", "1 egg", "2 tbsp breadcrumbs", "1/2 tsp garlic powder", "1/2 tsp onion powder", "1 large sweet potato (approx 300g)", "1 tsp butter", "1/2 cup frozen peas", "Salt & pepper"], "method": ["Mix mince, egg, breadcrumbs and spices. Shape into 4 small patties.", "Cook patties 4-5 min each side over medium-high heat.", "Boil cubed sweet potato 12-15 min, mash with butter and salt.", "Cook peas. Serve patties with mash and peas. Save 2 patties for a wrap another day."]}, "Baked Chicken Breast with Green Beans & Rice": {"cal": 390, "serves": "1 adult + toddler", "ingredients": ["1 large chicken breast (approx 200g)", "1 tsp olive oil", "1/2 tsp paprika", "1/2 tsp garlic powder", "1/2 cup (90g) white rice (dry)", "1.5 cups green beans, trimmed", "Salt & pepper"], "method": ["Preheat oven to 200C. Rub chicken with oil and spices.", "Bake on a lined tray 22-25 min until cooked through.", "Cook rice per packet. Steam or boil green beans 4-5 min.", "Slice chicken and serve with rice and beans."]}, "Beef Stir Fry with Noodles": {"cal": 430, "serves": "1 adult + toddler", "ingredients": ["200g lean beef strips", "80g dry thin egg noodles", "1/2 cup broccoli florets", "1/2 red capsicum, sliced", "1 carrot, julienned", "2 tbsp soy sauce (low sodium)", "1 tsp sesame oil", "1 clove garlic, minced", "1 tsp olive oil"], "method": ["Cook noodles per packet, drain, toss with a little sesame oil.", "Heat olive oil in a wok on high. Cook beef 2-3 min, set aside.", "Add garlic, capsicum, carrot and broccoli. Stir fry 4-5 min.", "Return beef, add soy sauce, toss. Serve over noodles."]}, "Slow Cooker Chicken Drumsticks with Roasted Veg": {"cal": 430, "serves": "1 adult + toddler", "ingredients": ["3 chicken drumsticks (approx 350g)", "1 tsp olive oil", "1 tsp paprika", "1/2 tsp garlic powder", "1/2 tsp onion powder", "1 sweet potato, cubed", "2 carrots, in chunks", "Salt & pepper"], "method": ["Rub drumsticks with oil and spices. Place in slow cooker with 2 tbsp water.", "Cook on LOW 5-6 hrs or HIGH 3 hrs.", "With 45 min left, roast sweet potato and carrot at 200C until golden.", "Serve drumsticks with roasted veg."]}, "Beef Mince & Veggie Stir Fry": {"cal": 450, "serves": "1 adult + toddler", "ingredients": ["250g lean beef mince", "1/2 cup (90g) white rice (dry)", "1 cup mixed stir-fry veg (carrot, capsicum, broccoli)", "2 tbsp soy sauce (low sodium)", "1 clove garlic, minced", "1 tsp sesame oil", "1 tsp olive oil"], "method": ["Cook rice per packet.", "Heat olive oil, brown mince with garlic.", "Add chopped veg, stir fry 5 min until tender.", "Add soy sauce and sesame oil, toss. Serve over rice."]}, "Baked Chicken Thighs with Mashed Potato": {"cal": 420, "serves": "1 adult + toddler", "ingredients": ["3 bone-in chicken thighs (approx 350g)", "1 tsp olive oil", "1/2 tsp garlic powder", "1/2 tsp paprika", "2 medium potatoes, peeled and cubed", "1 tsp butter", "1 cup green beans", "Salt & pepper"], "method": ["Preheat oven to 200C. Rub chicken with oil and spices, bake 35-40 min.", "Boil potatoes 12-15 min, mash with butter and a splash of oat milk.", "Steam green beans 4-5 min.", "Serve chicken with mash and beans."]}, "Lamb Chops with Mashed Potato & Broccoli": {"cal": 480, "serves": "1 adult + toddler (2 chops)", "ingredients": ["2 lamb loin chops (approx 300g)", "1 tsp olive oil", "1 clove garlic, minced", "1/2 tsp dried rosemary", "2 medium potatoes, peeled and cubed", "1 tsp butter", "1 cup broccoli florets", "Salt & pepper"], "method": ["Rub chops with oil, garlic, rosemary, salt and pepper. Rest 10 min.", "Boil potatoes 12-15 min, mash with butter and salt.", "Steam broccoli 5 min.", "Cook chops on a hot pan 3-4 min each side. Serve with mash and broccoli."]}, "Slow Cooker Beef & Vegetable Stew": {"cal": 450, "serves": "2-3 serves — great for leftovers", "ingredients": ["400g lean beef, cubed (chuck or stewing beef)", "2 carrots, in chunks", "2 potatoes, cubed", "1/2 onion, diced", "2 cups low-salt beef or chicken stock", "1 tbsp tomato paste", "1 tsp olive oil", "Salt & pepper"], "method": ["Brown beef in oil in a pan, then transfer to slow cooker.", "Add carrot, potato, onion, stock and tomato paste.", "Cook on LOW 6-7 hrs until beef is tender.", "Season and serve. Cool toddler's portion well before serving."]}, "Beef Mince Pasta": {"cal": 460, "serves": "2 serves — save one for later", "ingredients": ["250g lean beef mince", "1 can (400g) crushed tomatoes", "1 medium carrot, finely diced", "1/2 brown onion, diced", "2 cloves garlic, minced", "1 tsp olive oil", "1/2 tsp dried oregano", "1/2 tsp dried basil", "150g dry pasta", "Salt & pepper"], "method": ["Heat oil, cook onion 3 min, add garlic 1 min.", "Add mince, brown well, drain excess fat.", "Add carrot, tomatoes, oregano and basil. Simmer 20 min.", "Cook pasta per packet. Serve sauce over pasta."]}, "Roast Chicken Breast with Roasted Veg": {"cal": 390, "serves": "1 adult + toddler", "ingredients": ["1 large chicken breast (approx 200g)", "1 tsp olive oil", "1/2 tsp garlic powder", "1 sweet potato, cubed", "1 zucchini, chopped", "1 carrot, chopped", "Salt & pepper"], "method": ["Preheat oven to 200C. Toss veg with half the oil and salt on a tray.", "Rub chicken with remaining oil and garlic powder.", "Roast everything 25-30 min until chicken is cooked and veg golden.", "Slice chicken and serve with veg."]}, "Zucchini Noodle Bolognese": {"cal": 380, "serves": "1 adult + toddler", "ingredients": ["250g lean beef mince", "1 can (400g) crushed tomatoes", "2 medium zucchini, spiralised or peeled into ribbons", "1/2 onion, diced", "2 cloves garlic, minced", "1 tsp olive oil", "1/2 tsp dried oregano", "Salt & pepper"], "method": ["Heat oil, cook onion 3 min, add garlic 1 min.", "Add mince, brown, then add tomatoes and oregano. Simmer 15 min.", "Quickly pan fry or steam the zucchini noodles 2-3 min (don't overcook).", "Serve sauce over zucchini noodles. Mix some real pasta through your toddler's portion if they prefer."]}, "Soy & Ginger Pork Chops with Veg": {"cal": 430, "serves": "1 adult + toddler", "ingredients": ["2 pork loin chops (approx 300g)", "2 tbsp soy sauce (low sodium)", "1 tsp grated ginger", "1 clove garlic, minced", "1 tsp honey", "1/2 cup (90g) white rice (dry)", "1 cup steamed broccoli and carrot", "1 tsp olive oil"], "method": ["Mix soy, ginger, garlic and honey. Coat the pork and rest 10 min.", "Cook rice per packet. Steam the veg.", "Heat oil in a pan, cook pork 3-4 min each side until just cooked.", "Rest 2 min, slice and serve with rice and veg."]}, "Lemon & Garlic Chicken with Roasted Veg": {"cal": 400, "serves": "1 adult + toddler", "ingredients": ["1 large chicken breast (approx 200g)", "1 tsp olive oil", "1 clove garlic, minced", "Juice of 1/2 lemon", "1 sweet potato, cubed", "1 zucchini, chopped", "1 carrot, chopped", "Salt & pepper"], "method": ["Preheat oven to 200C. Toss veg with half the oil and salt on a tray, roast 15 min.", "Mix garlic, lemon juice and remaining oil. Coat the chicken.", "Add chicken to the tray, roast 20-25 min more until cooked.", "Slice and serve with the veg."]}, "Beef & Veggie Rice Bowl": {"cal": 430, "serves": "1 adult + toddler", "ingredients": ["200g lean beef strips", "1/2 cup (90g) white rice (dry)", "1 cup mixed veg (carrot, peas, corn)", "1 tbsp soy sauce (low sodium)", "1 tsp sesame oil", "1 tsp olive oil", "1 clove garlic, minced"], "method": ["Cook rice per packet.", "Heat olive oil, cook beef with garlic 2-3 min.", "Add veg, stir fry 4-5 min.", "Add soy sauce const LABELS = { breakfast:"Breakfast", lunch:"Lunch", dinner:"Dinner", snack:"Snack" };
const TARGET = 1400;
const DEFAULT_START_WEIGHT = 73.9;
const DEFAULT_MEASURES = [{key:"waist",label:"Waist"},{key:"hips",label:"Hips"},{key:"bust",label:"Bust / Chest"},{key:"thigh",label:"Thigh"},{key:"arm",label:"Upper arm"}];

const ls = {
  get:(k)=>{ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):null; }catch{return null;} },
  set:(k,v)=>{ try{ localStorage.setItem(k,JSON.stringify(v)); }catch{} },
};
function slug(s){ return s.toLowerCase().replace(/[^a-z0-9]+/g,"-").slice(0,48); }

function getWeekKey(offset=0){ const now=new Date(); const mon=new Date(now); mon.setDate(now.getDate()-((now.getDay()+6)%7)+offset*7); return "week-"+mon.toISOString().slice(0,10); }
function getWeekLabel(o){ if(o===0)return "This Week"; if(o===-1)return "Last Week"; if(o===-2)return "2 Weeks Ago"; if(o>0)return o+" Weeks Ahead"; return Math.abs(o)+" Weeks Ago"; }

// rotation default: weeks since a known Monday (2024-01-01), mod 4
function defaultMenu(offset){ const k=getWeekKey(offset).replace("week-",""); const mon=new Date(k+"T00:00:00"); const ref=new Date("2024-01-01T00:00:00"); const w=Math.round((mon-ref)/(7*86400000)); return ((((w)%4)+4)%4)+1; }

function defaultWeekData(){ const d={}; DAYS.forEach(day=>{ d[day]={}; SLOTS.forEach(s=>{ d[day][s]={selectedIdx:0,override:null,logged:false}; }); }); return d; }
function defaultGoals(){ const m={}; DEFAULT_MEASURES.forEach(({key,label})=>{ m[key]={label,start:null,log:[]}; }); return {startWeight:DEFAULT_START_WEIGHT,goalWeight:null,measures:m}; }
function calColor(c){ if(c<1000)return C.blue; if(c<=TARGET)return C.green; if(c<=1600)return C.amber; return C.red; }

const S = {

  input:{ background:C.cardAlt, border:`1px solid ${C.borderMid}`, color:C.text, borderRadius:8, padding:"9px 12px", fontSize:14, width:"100%", boxSizing:"border-box" },
  pill:(on)=>({ padding:"6px 14px", borderRadius:20, border:"1px solid", cursor:"pointer", fontSize:12.5, fontWeight:700, background:on?"#a78bfa26":"transparent", borderColor:on?C.accent:C.borderMid, color:on?C.accentTxt:C.text3 }),
  btn:(v)=>({ ghost:{ background:"transparent", border:`1px solid ${C.borderMid}`, color:C.text2, borderRadius:8, padding:"5px 12px", fontSize:12 }, primary:{ background:C.accent, border:"none", color:"#1a0f33", borderRadius:8, padding:"8px 18px", fontSize:13, fontWeight:800 }, danger:{ background:"transparent", border:"1px solid #7f3b3b", color:C.red, borderRadius:8, padding:"5px 10px", fontSize:11 } })[v||"ghost"],

  tag:(c)=>({ fontSize:10.5, fontWeight:800, letterSpacing:2, textTransform:"uppercase", color:c }),
  eyebrow:{ fontSize:11, color:C.text3, letterSpacing:2, textTransform:"uppercase", marginBottom:8, fontWeight:700 },
};

function App(){
  const todayIdx=(new Date().getDay()+6)%7;
  const [weekOffset,setWeekOffset]=useState(0);
  const [weekData,setWeekData]=useState(()=>ls.get(getWeekKey(0))||defaultWeekData());
  const [menuNum,setMenuNum]=useState(()=>{ const s=ls.get("menu-"+getWeekKey(0)); if(s)return s; const d=defaultMenu(0); ls.set("menu-"+getWeekKey(0),d); return d; });
  const [weightLog,setWeightLog]=useState(()=>ls.get("weight-log")||[]);
  const [goals,setGoals]=useState(()=>({ ...defaultGoals(), ...(ls.get("goals")||{}) }));
  const [shopState,setShopState]=useState(()=>ls.get("shop-"+getWeekKey(0))||{});
  const [activeDay,setActiveDay]=useState(DAYS[todayIdx]);
  const [dayView,setDayView]=useState("diary");
  const [view,setView]=useState("tracker");
  const [editSlot,setEditSlot]=useState(null);
  const [overInput,setOverInput]=useState({text:"",cal:""});
  const [showOpts,setShowOpts]=useState(null);
  const [wtInput,setWtInput]=useState(""); const [wtNote,setWtNote]=useState("");
  const [startWtIn,setStartWtIn]=useState(String(goals.startWeight??DEFAULT_START_WEIGHT));
  const [goalWtIn,setGoalWtIn]=useState(goals.goalWeight!=null?String(goals.goalWeight):"");
  const [mInput,setMInput]=useState({}); const [mStartIn,setMStartIn]=useState({}); const [openMeas,setOpenMeas]=useState(null);

  useEffect(()=>{ const wk=getWeekKey(weekOffset); setWeekData(ls.get(wk)||defaultWeekData()); setShopState(ls.get("shop-"+wk)||{}); let mn=ls.get("menu-"+wk); if(!mn){ mn=defaultMenu(weekOffset); ls.set("menu-"+wk,mn); } setMenuNum(mn); setEditSlot(null); setShowOpts(null); },[weekOffset]);

  const menu = MENUS[menuNum] || MENUS[1];

  function saveWeek(d){ ls.set(getWeekKey(weekOffset),d); }
  function saveGoals(g){ setGoals(g); ls.set("goals",g); }
  function saveShop(s){ setShopState(s); ls.set("shop-"+getWeekKey(weekOffset),s); }
  function pickMenu(n){ setMenuNum(n); ls.set("menu-"+getWeekKey(weekOffset),n); setShowOpts(null); }

  function updateSlot(day,slot,patch){ const next={...weekData,[day]:{...weekData[day],[slot]:{...weekData[day][slot],...patch}}}; setWeekData(next); saveWeek(next); }
  function applyOverride(day,slot){ const cal=parseInt(overInput.cal); if(!overInput.text.trim()||isNaN(cal)||cal<0)return; updateSlot(day,slot,{override:{text:overInput.text.trim(),cal},logged:true}); setEditSlot(null); setOverInput({text:"",cal:""}); }
  function clearOverride(day,slot){ updateSlot(day,slot,{override:null}); }
  function selectPlan(day,slot,idx){ updateSlot(day,slot,{selectedIdx:idx,override:null,logged:true}); setShowOpts(null); }
  function toggleLogged(day,slot){ updateSlot(day,slot,{logged:!weekData[day][slot].logged}); }

  function addWeight(){ const kg=parseFloat(wtInput); if(isNaN(kg)||kg<30||kg>300)return; const next=[{date:new Date().toISOString(),kg,note:wtNote.trim()},...weightLog].slice(0,104); setWeightLog(next); ls.set("weight-log",next); setWtInput(""); setWtNote(""); }
  function deleteWeight(i){ const next=weightLog.filter((_,j)=>j!==i); setWeightLog(next); ls.set("weight-log",next); }

  function saveStartWeight(){ const v=parseFloat(startWtIn); if(isNaN(v)||v<30||v>300)return; saveGoals({...goals,startWeight:v}); }
  function saveGoalWeight(){ if(goalWtIn.trim()===""){ saveGoals({...goals,goalWeight:null}); return; } const v=parseFloat(goalWtIn); if(isNaN(v)||v<30||v>300)return; saveGoals({...goals,goalWeight:v}); }
  function saveMeasureStart(key){ const raw=mStartIn[key]; const v=parseFloat(raw); const meas={...goals.measures}; meas[key]={...meas[key],start:(raw===""||isNaN(v))?null:v}; saveGoals({...goals,measures:meas}); }
  function addMeasureReading(key){ const v=parseFloat(mInput[key]); if(isNaN(v)||v<=0||v>400)return; const meas={...goals.measures}; const log=[{date:new Date().toISOString(),val:v},...(meas[key].log||[])].slice(0,104); meas[key]={...meas[key],log}; saveGoals({...goals,measures:meas}); setMInput(p=>({...p,[key]:""})); }
  function deleteMeasureReading(key,i){ const meas={...goals.measures}; meas[key]={...meas[key],log:meas[key].log.filter((_,j)=>j!==i)}; saveGoals({...goals,measures:meas}); }

  function toggleShop(id){ saveShop({...shopState,[id]:!shopState[id]}); }
  function resetShop(){ saveShop({}); }

  function getSlot(day,slot){ const s=weekData[day]?.[slot]||{selectedIdx:0,override:null,logged:false}; const plan=menu[day][slot]; const selected=plan[s.selectedIdx]||plan[0]; const active=s.override||selected; return {...s,plan,selected,active}; }
  function dayCals(day,loggedOnly){ return SLOTS.reduce((sum,slot)=>{ const {active,logged}=getSlot(day,slot); return sum+(loggedOnly?(logged?active.cal:0):active.cal); },0); }
  function fmtDate(iso){ return new Date(iso).toLocaleDateString("en-AU",{day:"numeric",month:"short",year:"numeric"}); }
  function fmtKg(kg){ return kg.toFixed(1)+" kg"; }

  const startWeight=goals.startWeight??DEFAULT_START_WEIGHT;
  const latest=weightLog[0];
  const delta=latest?(latest.kg-startWeight).toFixed(1):null;

  const allShopItems=SHOPPING[menuNum].reduce((a,g)=>a+g.items.length,0);
  const checkedCount=SHOPPING[menuNum].reduce((a,g)=>a+g.items.filter(it=>shopState[slug(menuNum+g.cat+it.n)]).length,0);

  // swapped-in alternates (selectedIdx===1, no override, recipe exists)
  const swaps=[];
  DAYS.forEach(day=>MEAL_SLOTS.forEach(slot=>{ const s=weekData[day]?.[slot]; if(s&&s.selectedIdx===1&&!s.override){ const name=menu[day][slot][1]?.text; if(name&&RECIPES[name]) swaps.push({day,slot,name}); } }));

  function MenuSelector(){
    return (
      <div style={{ marginBottom:16 }}>
        <div style={{ fontSize:10.5, color:C.text3, letterSpacing:2, textTransform:"uppercase", fontWeight:700, marginBottom:7 }}>This week's menu</div>
        <div style={{ overflowX:"auto", paddingBottom:2 }}>
          <div style={{ display:"flex", gap:6, width:"max-content" }}>
            {[1,2,3,4].map(n=>{ const on=menuNum===n; return (
              <button key={n} onClick={()=>pickMenu(n)} style={{ padding:"8px 13px", borderRadius:12, border:"1px solid", cursor:"pointer", textAlign:"left", minWidth:120,
                borderColor:on?C.accent:C.border, background:on?"#a78bfa26":C.card }}>
                <div style={{ fontSize:11, fontWeight:800, color:on?C.accentTxt:C.text3 }}>Menu {n}</div>
                <div style={{ fontSize:12.5, fontWeight:700, color:on?C.text:C.text2, marginTop:1 }}>{MENU_NAMES[n]}</div>
              </button> ); })}
          </div>
        </div>
      </div>
    );
  }

  return (
    <div style={S.app}>
      <div style={S.hdr}>
        <div style={{ maxWidth:680, margin:"0 auto" }}>
          <div style={{ fontSize:10, letterSpacing:5, color:C.text3, textTransform:"uppercase", marginBottom:6, fontWeight:700 }}>Alida's Tracker</div>
          <div style={{ display:"flex", alignItems:"flex-start", justifyContent:"space-between" }}>
            <div>
              <h1 style={{ fontSize:22, fontWeight:800, color:"#f6f3ff", lineHeight:1.2 }}>Meal &amp; Body<br/><span style={{ color:C.accentTxt }}>Tracker</span></h1>
              <p style={{ fontSize:11.5, color:C.text3, marginTop:4 }}>Menu {menuNum} · {MENU_NAMES[menuNum]} · {getWeekKey(weekOffset).replace("week-","")}</p>
            </div>
            {latest && (<div style={{ textAlign:"right", flexShrink:0 }}>
              <div style={{ fontSize:22, fontWeight:800, color:"#f6f3ff" }}>{fmtKg(latest.kg)}</div>
              <div style={{ fontSize:11.5, color: delta<=0?C.greenTxt:C.red }}>{delta>0?"+":""}{delta} kg from start</div>
            </div>)}
          </div>
          <div style={{ display:"flex", gap:8, marginTop:14, flexWrap:"wrap" }}>
            {[["goals","🎯 Goals"],["tracker","📋 Tracker"],["shopping","🛒 Shopping"],["weight","⚖️ Weight"],["history","📊 History"]].map(([v,lbl])=>(
              <button key={v} onClick={()=>setView(v)} style={S.pill(view===v)}>{lbl}</button>
            ))}

              <div style={S.eyebrow}>Log Today's Weight</div>
              <div style={{ display:"flex", gap:8, marginBottom:8 }}><input style={{ ...S.input, width:110 }} type="number" step="0.1" min="30" max="300" placeholder="e.g. 72.5" value={wtInput} onChange={e=>setWtInput(e.target.value)}/><span style={{ color:C.text3, alignSelf:"center", fontSize:13 }}>kg</span><button onClick={addWeight} style={{ ...S.btn("primary"), marginLeft:"auto" }}>Log Weight</button></div>
              <input style={S.input} placeholder="Optional note (e.g. 'time of month', 'felt bloated')" value={wtNote} onChange={e=>setWtNote(e.target.value)}/>
            </div>
            {latest && (<div style={{ ...S.card, marginBottom:16 }}><div style={{ display:"flex", gap:12, flexWrap:"wrap" }}>{[["Start",startWeight.toFixed(1)+" kg",C.text3],["Current",fmtKg(latest.kg),C.accentTxt],["Change",(delta>0?"+":"")+delta+" kg",delta<=0?C.greenTxt:C.red],["Goal",goals.goalWeight!=null?goals.goalWeight.toFixed(1)+" kg":"Lean & strong",C.blue]].map(([l,v,col])=>(<div key={l} style={{ flex:"1 1 90px" }}><div style={{ fontSize:10, color:C.faint, textTransform:"uppercase", letterSpacing:2 }}>{l}</div><div style={{ fontSize:17, fontWeight:800, color:col, marginTop:2 }}>{v}</div></div>))}</div></div>)}
            {weightLog.length>1 && (()=>{ const sorted=[...weightLog].reverse(); const vals=sorted.map(e=>e.kg); const mn=Math.min(...vals)-0.5, mx=Math.max(...vals)+0.5, rng=mx-mn||1; const W=560,H=110; const pts=sorted.map((e,i)=>((i/(sorted.length-1))*(W-40)+20)+","+(H-((e.kg-mn)/rng)*(H-20)-10));
              return (<div style={{ ...S.card, marginBottom:16, overflowX:"auto" }}><div style={S.eyebrow}>Weight Trend</div><svg viewBox={"0 0 "+W+" "+H} style={{ width:"100%", height:H }}><polyline points={pts.join(" ")} fill="none" stroke={C.accent} strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"/>{sorted.map((e,i)=>{ const x=(i/(sorted.length-1))*(W-40)+20, y=H-((e.kg-mn)/rng)*(H-20)-10; return <circle key={i} cx={x} cy={y} r="3.5" fill={C.accentTxt}/>; })}</svg></div>); })()}
            <div style={S.eyebrow}>Log History</div>
            {weightLog.length===0 && <div style={{ ...S.card, color:C.text3, fontSize:13, textAlign:"center" }}>No weight logged yet. Add your first weigh-in above.</div>}
            {weightLog.map((e,i)=>(<div key={i} style={{ ...S.card, display:"flex", alignItems:"center", gap:12 }}><div style={{ flex:1 }}><div style={{ fontSize:18, fontWeight:800, color:C.accentTxt }}>{fmtKg(e.kg)}</div><div style={{ fontSize:12.5, color:C.text3 }}>{fmtDate(e.date)}{e.note?" · "+e.note:""}</div>{i<weightLog.length-1 && (<div style={{ fontSize:11.5, color:e.kg<weightLog[i+1].kg?C.greenTxt:C.red, marginTop:2 }}>{(e.kg-weightLog[i+1].kg).toFixed(1)} kg from previous</div>)}</div><button onClick={()=>deleteWeight(i)} style={S.btn("danger")}>✕</button></div>))}
          </div>
        )}

        {view==="history" && (
          <div style={{ marginTop:20 }} className="fade-in">
            <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", marginBottom:12 }}><button onClick={()=>setWeekOffset(w=>w-1)} style={S.btn("ghost")}>← Prev Week</button><span style={{ fontSize:13, color:C.accentTxt, fontWeight:700 }}>{getWeekLabel(weekOffset)}</span><button onClick={()=>setWeekOffset(w=>w+1)} style={S.btn("ghost")}>Next →</button></div>
            <div style={{ ...S.card, marginBottom:16 }}>
              <div style={{ fontSize:12.5, color:C.accentTxt, fontWeight:800, marginBottom:2 }}>{getWeekLabel(weekOffset)} — Daily Calories</div>
              <div style={{ fontSize:11, color:C.text3, marginBottom:10 }}>Menu {menuNum} · {MENU_NAMES[menuNum]}</div>
              {DAYS.map(day=>{ const logged=dayCals(day,true); const planned=dayCals(day,false); const hasLog=SLOTS.some(s=>weekData[day]?.[s]?.logged); const display=hasLog?logged:planned; const color=calColor(display); const pct=Math.min((display/TARGET)*100,100);
                return (<div key={day} onClick={()=>{ setView("tracker"); setActiveDay(day); setDayView("diary"); }} style={{ padding:"7px 0", cursor:"pointer", borderBottom:`1px solid ${C.borderSub}` }}>
                  <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:3 }}><span style={{ fontSize:13, color:C.text2 }}>{day}</span><span style={{ fontSize:12, fontWeight:700, color }}>{display} kcal {!hasLog && <span style={{ color:C.faint, fontWeight:400 }}>(planned)</span>}</span></div>
                  <div style={{ background:C.borderSub, borderRadius:99, height:4 }}><div style={{ width:pct+"%", height:"100%", background:color, borderRadius:99 }}/></div>
                </div>); })}
              <div style={{ marginTop:10, paddingTop:8, borderTop:`1px solid ${C.borderMid}`, display:"flex", justifyContent:"space-between" }}><span style={{ fontSize:12, color:C.text3 }}>Week total (logged only)</span><span style={{ fontSize:14, fontWeight:800, color:C.accentTxt }}>{DAYS.reduce((s,d)=>s+dayCals(d,true),0)} kcal</span></div>
            </div>
            {(()=>{ const customs=[]; DAYS.forEach(day=>SLOTS.forEach(slot=>{ const d=weekData[day]?.[slot]; if(d?.override) customs.push({day,slot,...d.override}); }));
              return customs.length>0?(<div style={{ ...S.card, marginBottom:16 }}><div style={{ fontSize:11, color:C.amber, letterSpacing:2, textTransform:"uppercase", marginBottom:8, fontWeight:700 }}>Custom meals this week</div>{customs.map((c,i)=>(<div key={i} style={{ padding:"6px 0", borderBottom:i<customs.length-1?`1px solid ${C.borderSub}`:"none" }}><div style={{ fontSize:11, color:C.text3 }}>{c.day} · {c.slot}</div><div style={{ fontSize:13.5, color:C.amber }}>{c.text} <span style={{ color:C.text3 }}>· {c.cal} kcal</span></div></div>))}</div>):null; })()}
            {weightLog.length>0 && (<div style={S.card}><div style={S.eyebrow}>Recent Weight</div>{weightLog.slice(0,6).map((e,i)=>(<div key={i} style={{ display:"flex", justifyContent:"space-between", padding:"4px 0", borderBottom:`1px solid ${C.borderSub}` }}><span style={{ fontSize:12.5, color:C.text3 }}>{fmtDate(e.date)}{e.note?" · "+e.note:""}</span><span style={{ fontSize:13.5, fontWeight:700, color:C.accentTxt }}>{fmtKg(e.kg)}</span></div>))}{weightLog.length>6 && <div style={{ fontSize:11.5, color:C.faint, marginTop:6 }}>+{weightLog.length-6} more — view in Weight tab</div>}</div>)}
          </div>
        )}

      </div>
      <div style={{ height:40 }}/>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
